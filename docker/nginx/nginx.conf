# Nginx: the only service with a host port. It forwards every request to the
# application server (Gunicorn) on the internal Compose network.
upstream jobmarket_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://jobmarket_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
