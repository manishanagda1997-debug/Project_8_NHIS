[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-analysis"
version = "1.0.0"
description = "Upwork job-market analysis, forecasting and job recommendation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "flask>=3.0",
    "python-pptx>=1.0",
    "tomli>=2.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "ipykernel>=6.25",
]

[project.scripts]
job-market = "job_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_market_web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
# pythonpath lets the ordinary tests import the package from src/. The
# notebook-execution test starts a separate Jupyter kernel, which imports the
# package only after `pip install -e .`, as the README setup does.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
