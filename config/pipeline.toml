# Pipeline configuration.
# Every threshold that shapes a result lives here, so a reader can see and
# question each decision in one place. Code reads these values; code never
# hard-codes them.

[project]
name = "job-market-analysis"
random_seed = 42

[paths]
# All paths are relative to the project root.
raw_csv = "data/raw/all_upwork_jobs_2024-02-07-2024-03-24.csv"
interim_dir = "data/interim"
processed_dir = "data/processed"
reports_dir = "reports"
notebooks_dir = "notebooks"
manifest = "data/processed/run_manifest.json"
# Manual labels (inputs written by a person, never generated or deleted by a build)
labels_dir = "data/labels"

[schema]
# The raw file must contain exactly these columns, in any order.
required_columns = [
    "title",
    "link",
    "published_date",
    "is_hourly",
    "hourly_low",
    "hourly_high",
    "budget",
    "country",
]
# Timestamps in the source carry a UTC offset, and all daily grouping uses
# UTC days. This rule lives in code (see decision D-005), not in a setting.

[cleaning]
# Day quality (decision D-013). Every day is compared with normal days of the
# same weekday, never with itself.
# Reference days: at least this share of a full collection day, where a full
# day is this quantile of daily postings. This only separates the main
# collection period from the sparse early weeks.
reference_day_share = 0.5
reference_quantile = 0.9
# A day with less than this share of the median postings of its weekday is
# incomplete. Normal days in this data score 0.93-1.10; damaged days 0.86 or less.
min_day_ratio = 0.9
# An hour with less than this share of the median for the same weekday and UTC
# hour is weak; a normal-volume day with weak hours has an intraday gap.
weak_hour_share = 0.3
# Extreme pay values are flagged at or above this quantile (decision D-015).
extreme_quantile = 0.999
# Repeat and repost windows in days (decision D-016). The primary window is a
# reasoned choice: the gaps between repeats show no natural break.
repeat_windows_days = [1, 3, 7]
primary_repeat_window_days = 3

[taxonomy]
# The version label changes whenever the category definitions or rules
# change, so every output can state which rule set produces it. It must equal
# TAXONOMY_VERSION in src/job_market/taxonomy.py (a test checks this).
version = "1.0"

[labels]
# Manual-label samples (decision D-027). Changing any value draws different
# samples, so never change them after labelling has started.
seed = 20261003
blind_size = 350
dev_random = 110
dev_short_titles = 20
dev_joined_titles = 20
# The extract of the historical recommender evaluation (decision D-040). A
# rebuild of exactly this extract must reproduce the preserved rankings in
# data/labels/historical_rankings.toml; for any other extract the comparison
# does not apply. A missing record on this extract is an error, never a skip.
historical_source_sha256 = "6513e9a744f15726bdb40d6435a60834e864ace08a75e1d7feb75e10ddb78b11"

[categorize]
# Job-function categories (decision D-028). Values marked "provisional" are
# chosen on the development labels and then frozen before the blind test.
# The taxonomy (the category list and definitions) is frozen at 1.0; the
# categorizer (rules, weights, model, threshold) has its own version. It stays
# "0.x-dev" until the freeze, then becomes "1.0".
categorizer_version = "1.0"
# A category needs at least this many rule points (weights 3/2/1).
min_rule_score = 2
# Weak labels for the classifier: rule score at least this high and no other
# category left after the tie-breaks.
weak_label_min_score = 5
# Very large categories are sampled down to this many distinct titles.
weak_label_max_per_category = 4000
# A category with fewer weak labels than this is left out of training.
min_weak_labels_per_category = 20
# Share of weak labels held out to check how well the classifier copies the rules.
holdout_share = 0.2
# Logistic regression settings.
classifier_c = 4.0
max_iter = 2000
max_char_features = 200000
# Below this probability a classifier guess becomes Other / Unclear (decision D-029).
classifier_threshold = 0.7
# The fallback classifier may only assign these categories (decision D-029).
# Chosen once on the grouped, masked proxy test at the threshold above: a
# category qualifies with at least 30 proxy predictions and at least 70%
# agreement. The list is fixed here, never recalculated during a build. Rules
# can still assign all 22 categories.
fallback_min_proxy_predictions = 30
fallback_min_proxy_agreement = 0.7
fallback_categories = [
    "accounting_finance",
    "admin_virtual_assistance",
    "customer_service",
    "data_analytics",
    "design_creative",
    "digital_marketing",
    "ecommerce_operations",
    "mobile_development",
    "sales_lead_generation",
    "software_it",
    "translation_transcription",
    "video_animation",
    "web_development",
    "writing_content",
]

[pay]
# Keyword-pay associations and client-country rates (decision D-031).
# A keyword needs this many rated jobs and this many distinct title keys, so a
# single heavily repeated title cannot carry it.
min_keyword_jobs = 300
min_keyword_title_keys = 100
# A single word is dropped when at least this share of its jobs also contain a
# kept two-word phrase with that word ("social" inside "social media").
keyword_overlap = 0.8
# Countries need at least 30 rated jobs for their own result (decision D-020).
min_country_jobs = 30
# Cluster-bootstrap repetitions (resampling whole title_key groups).
median_bootstrap_reps = 500
index_bootstrap_reps = 200
# Held-out share for the explanatory-power check (split by title_key).
test_share = 0.2
ridge_alpha = 1.0

[trends]
# Emerging categories and online-hiring signals (decision D-032).
# Newey-West lag in days, fixed before any result was seen: one week.
newey_west_lag = 7
# Fewer days than this in the window: no trend is estimated.
min_days = 21
# Keyword trends: the support rules of Notebook 04, plus presence in at least
# this many ISO weeks so one short burst cannot pose as a five-week trend.
min_keyword_jobs = 300
min_keyword_title_keys = 100
min_keyword_weeks = 3
keyword_overlap = 0.8
# New or notable terms counted per week only (too rare for trend inference).
watch_terms = ["sora", "gemini", "claude", "devin", "midjourney", "llm", "ai agent", "gpt", "chatgpt",
               "vision pro", "tiktok shop", "faceless", "ugc"]

[arrangement]
# Work-arrangement and time-zone wording audit (decision D-041). Fixed before
# any title is labelled. Distinct title keys in the time-series window are
# split once, globally, into development and evaluation by a seeded hash.
seed = 20261007
development_share = 0.4
# Development sample per stratum (D1 is always taken in full).
dev_time_zone = 40
dev_on_site = 40
dev_remote_home = 60
dev_candidates = 40
dev_unmatched = 40
pilot_titles = 30
# Hybrid audit selection criterion: the old "hybrid" signal pattern, frozen.
hybrid_audit_pattern = "hybrid"
# Alternative wordings the old rules may miss (candidates for review, not rules).
candidate_patterns = [
    "anywhere|work from anywhere", "home based|from home|at home", "in office|office based|in the office",
    "relocate|relocation", "days a week|days per week", "local to|located in|based in|must live|must reside",
    "gmt \\d+|utc \\d+", "overlap|night shift|day shift|us time|uk time|eastern time|pacific time|central time|australian time",
]
# Evaluation-side titles identified as seen during rule development (groups
# G1-G4, decision D-041). The evaluation sampler refuses to run unless this file
# matches the frozen hash, and never draws these keys into the blind sample.
quarantine_file = "data/labels/arrangement_eval_quarantine.csv"
quarantine_sha256 = "e2f6c5c5504286a98e2eb7553b8dc24df719be4f8d1506d1ff4f3d8b88ae6df8"
# Evaluation design (D-041), fixed before any evaluation title is drawn. The
# sampler and the scorer stop unless the rules match rules 1.0 (tag
# arrangement-rules-1.0) by version and by source fingerprint.
rules_version = "1.0"
rules_fingerprint = "0e9a15c656088e92d88d659f7cc5b2a4a7bb4c10a49ca042b62a4dbc08f79d14"
# Sample sizes are a fixed practical labelling budget, not a power calculation.
# S1 and S3 are labelled in full.
eval_s2 = 100
eval_s4 = 40
eval_s5 = 60
eval_seed = 20261009
simulation_seed = 20261010
simulation_draws = 100000

[forecast]
# Short-horizon forecasts (decision D-033). Every value is fixed before any
# evaluation is run.
# Forecast length; days 1-7 are the primary forecast, 8-14 an extended outlook.
horizon_days = 14
tested_horizon_days = 7
# Reserved final forecast evaluation window: the last 7 days of the window,
# used neither for fitting nor for model choice.
final_days = 7
# Shortest training history in the rolling-origin backtest (two full weeks).
first_train_days = 14
# Damped trend: each day ahead keeps this share of the previous day's trend.
damping_phi = 0.9
# 80% empirical forecast ranges from backtest errors.
range_lower = 0.1
range_upper = 0.9
# A share change below this (percentage points) is called "stable".
stable_change_pp = 0.1

[recommend]
# Job recommendations (decision D-034). Frozen on 4 October 2026, before any
# retrieval result was generated or seen. Changing any value after the
# relevance labels exist invalidates the evaluation.
recommender_version = "1.0"
# Candidate pool: jobs posted in the final N observed days of the time-series
# window (the evaluation uses 14; the app also offers 7, 30 and "all").
pool_days = 14
pool_day_options = [7, 14, 30, 0]          # 0 = all available days
results = 10
eval_top_k = 5
# Methods in order of complexity (simplest first; a full tie goes to the simpler).
methods = ["keyword", "tfidf_word", "tfidf_hybrid"]
# Word TF-IDF: single words and two-word phrases without stop words, built from
# title keys; a term must appear in at least this many indexed titles.
word_min_df = 2
# Character TF-IDF: 3-5 character pieces inside word boundaries.
char_ngram_min = 3
char_ngram_max = 5
char_min_df = 2
# Hybrid score = weight x word similarity + (1 - weight) x character similarity.
hybrid_word_weight = 0.5
# Winner rule: highest mean graded nDCG@5 (gains 2/1/0). Differences below
# this are "effectively tied"; then strict Precision@5 (only label 2 counts);
# then the simpler method.
tie_threshold = 0.02
# Shuffling the blinded relevance sheet.
sheet_seed = 20261004
# Related market keywords to explore: terms from Notebook 04/05 that appear in
# at least this many of the profile's top matching jobs.
related_top_jobs = 50
related_min_jobs = 3
related_max_terms = 5
related_max_q = 0.05
# Post-output refinement, fixed once on 4 October 2026 after the first version
# returned generic words; not tuned again (decision D-034). A keyword must add
# a word that is neither generic nor already in the profile (same first 5
# letters counts as present: "analyst" ~ "analysis"), and be at least twice
# as common in the matched jobs as in the whole pool. No result is allowed.
related_min_lift = 2.0
related_prefix_chars = 5
related_generic_words = [
    # requests and actions
    "need", "needed", "required", "wanted", "looking", "seeking", "help", "create", "build", "make", "setup",
    "set", "get", "find", "fix", "update", "improve", "develop",
    # project words
    "project", "projects", "job", "jobs", "work", "task", "tasks", "service", "services", "support",
    "simple", "quick", "small", "new", "long", "term", "ongoing", "urgent", "easy", "full", "time", "part",
    # seniority and job roles
    "expert", "experts", "specialist", "professional", "pro", "senior", "junior", "experienced", "skilled",
    "freelancer", "consultant", "assistant", "developer", "developers", "engineer", "designer", "analyst",
    "writer", "editor", "manager", "team", "person", "someone", "partner",
]
# Filter scenarios for the coverage and filter checks (no filters during the
# relevance evaluation).
check_scenarios = [
    { name = "no_filter" },
    { name = "hourly_min_30", contract = "hourly", min_hourly = 30.0 },
    { name = "hourly_min_50", contract = "hourly", min_hourly = 50.0 },
    { name = "fixed_min_500", contract = "fixed", min_budget = 500.0 },
]

