# Pipeline configuration.
# Every threshold that shapes a result lives here, so a reader can see and
# question each decision in one place. Code reads these values; code never
# hard-codes them.

[project]
name = "job-market-analysis"
random_seed = 42

[paths]
# All paths are relative to the project root.
raw_csv = "data/raw/all_upwork_jobs_2024-02-07-2024-03-24.csv"
interim_dir = "data/interim"
processed_dir = "data/processed"
reports_dir = "reports"
notebooks_dir = "notebooks"
manifest = "data/processed/run_manifest.json"
# Manual labels (inputs written by a person, never generated or deleted by a build)
labels_dir = "data/labels"

[schema]
# The raw file must contain exactly these columns, in any order.
required_columns = [
    "title",
    "link",
    "published_date",
    "is_hourly",
    "hourly_low",
    "hourly_high",
    "budget",
    "country",
]
# Timestamps in the source carry a UTC offset, and all daily grouping uses
# UTC days. This rule lives in code (see decision D-005), not in a setting.

[cleaning]
# Day quality (decision D-013). A weak hour has fewer postings than this share
# of the day's median hour; an empty hour is always weak.
weak_hour_share = 0.3
# A day with more weak hours than this is incomplete; with 1..this many it has
# an intraday gap and stays in the time-series window, flagged.
max_weak_hours_for_gap = 2
# A day with fewer postings than this share of the median day is incomplete.
min_day_volume_share = 0.25
# Extreme pay values are flagged at or above this quantile (decision D-015).
extreme_quantile = 0.999
# Repeat and repost windows in days (decision D-016). The primary window is a
# reasoned choice: the gaps between repeats show no natural break.
repeat_windows_days = [1, 3, 7]
primary_repeat_window_days = 3

[taxonomy]
# The version label changes whenever the category definitions or rules
# change, so every output can state which rule set produces it. It must equal
# TAXONOMY_VERSION in src/job_market/taxonomy.py (a test checks this).
version = "1.0"

[labels]
# Manual-label samples (decision D-027). Changing any value draws different
# samples, so never change them after labelling has started.
seed = 20261003
blind_size = 350
dev_random = 110
dev_short_titles = 20
dev_joined_titles = 20
